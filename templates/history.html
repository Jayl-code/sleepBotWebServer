<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/static/images/favicon.png">
    <title>Sleep Bot DB History</title>
</head>
<body>

<h1>All History</h1>

<table border="1" cellpadding="8">
    <tr>
        {% for col in rows[0].keys() %}
            <th>{{ col }}</th>
        {% endfor %}
    </tr>

    {% for row in rows %}
    <tr>
        {% for col in row.keys() %}
            <td>{{ row[col] }}</td>
        {% endfor %}
    </tr>
    {% endfor %}
</table>

Delete row
<form action="/delete_id" method="POST">
    <input type="text" name="id" placeholder="ID to delete">
    <button type="submit">Submit</button>
</form>

Update row
<form action="/update_day" method="POST">
    <input type="text" name="date" placeholder="YYY-MM-DD">
    <input type="text" name="column" placeholder="(column name)">
    <input type="text" name="updated" placeholder="(new value)">
    <button type="submit">Submit</button>
</form>

</body>
</html>
