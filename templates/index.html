<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Bot</title>

  <link rel="icon" type="image/png" href="/static/images/favicon.png">
  <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">

  <script src="https://kit.fontawesome.com/6a06188459.js" crossorigin="anonymous"></script>
</head>

<body>

  <!-- Streak -->
  <div class="streak">
    <div class="streak_row {{ 'active' if streakActive else 'inactive' }}">
      <div id="streak">Streak: {{ streak }}</div>
      <i class="fa-solid fa-fire"></i>
    </div>
  </div>

  <!-- Scores -->
  <div class="scores" onclick="location.reload()">
    <div id="highscore" class="{{ 'active' if highscore > 0 and highscore == score else 'inactive'}}">High Score: {{ highscore }}</div>
    <div id="current_score">Current Score: {{ score }}</div>
  </div>

  <!-- Habits -->
  <div class="habits">
    <div class="habits_row">
      <div id="habit1" class="{{ 'h_on' if habitsActive.habit1 else 'h_off' }}">{{ habits.habit1 }}</div>
      <div id="habit2" class="{{ 'h_on' if habitsActive.habit2 else 'h_off' }}">{{ habits.habit2 }}</div>
      <div id="habit3" class="{{ 'h_on' if habitsActive.habit3 else 'h_off' }}">{{ habits.habit3 }}</div>
      <div id="habit4" class="{{ 'h_on' if habitsActive.habit4 else 'h_off' }}">{{ habits.habit4 }}</div>
    </div>
  </div>

  <!-- Times -->
  <div class="times">

    <!-- Alarm -->
    <div class="alarm_time">
      <div id="alarm_time">
        <i class="fa-solid fa-alarm-clock"></i> 
        Alarm time: {{ alarm_time }}
        <button id="alarm_settings_btn" type="button">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>

      <form id="alarm_form" method="post" action="/set_alarm" style="display: none; margin-top: 10px;">
        <label for="alarm_time_input">New alarm time:</label>
        <input type="time" id="alarm_time_input" name="alarm_time" required>
        <button type="submit"><i class="fa-solid fa-circle-check"></i></button>
      </form>
    </div>

    <!-- Clockout -->
    <div class="clockout_time">
      <div id="clockout_time">
        <i class="fa-solid fa-clock"></i>
        Clockout time: {{ clockout_time }}
        <button id="clockout_settings_btn" type="button">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>

      <form id="clockout_form" method="post" action="/set_clockout" style="display:none; margin-top: 10px;">
        <label for="clockout_time_input">New clockout time:</label>
        <input type="time" id="clockout_time_input" name="clockout_time" required>
        <button type="submit"><i class="fa-solid fa-circle-check"></i></button>
      </form>
    </div>

  </div>

  <!-- Days -->
  <div class="day_container">
    <div class="day_row">
      {% for day, enabled in alarm_days.items() %}
        <div class="day_box {{ 'on' if enabled else 'off' }}"
             onclick="toggleDay('{{ day }}', this)">
          {{ day[0].upper() }}
        </div>
      {% endfor %}
    </div>
  </div>

  <!-- History and Light Control -->
   <div class="button_row">

    <div class="light_status">
      <form id="light_form" method="get" action="/toggle_light_mode">
        <button class="{{ 'on' if light_mode else 'off' }}" type="submit">
          <i class="fa-solid fa-lightbulb"></i>
        </button>
      </form>
    </div>

    <div class="history_button">
      <form id="history_form" method="get" action="/history">
        <button type="submit">
          <i class="fa fa-history"></i>
        </button>
      </form>
    </div>

   </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
